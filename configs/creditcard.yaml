# Kaggle ULB credit-card dataset. CLI flags of `python -m fraud.train` override these values.
dataset: creditcard
seed: 42

paths:
  data: data/raw/creditcard.csv
  artifacts: artifacts/creditcard
  outputs: outputs/creditcard

split:            # chronological: train | validation | test
  val_frac: 0.15
  test_frac: 0.15

threshold:
  method: cost    # cost: maximise savings | fbeta: maximise F-beta
  beta: 1.0       # only used by method: fbeta; >1 favours recall

costs:
  review_cost: 5.0  # cost of investigating one alert, in the currency of Amount.
                    # A missed fraud costs its full amount.

evaluation:
  cv_folds: 4                     # rolling time-series folds inside train+validation; 0 = off
  cv_fold_frac: 0.1               # size of each CV test block (share of train+validation)
  selection_metric: savings_rate  # CV mean used to pick the model: savings_rate | pr_auc
  alert_budgets_per_day: [50, 100, 200]  # precision@k / recall@k for these review capacities

explain:
  shap: true
  sample_size: 500

models:
  Logistic Regression:
    max_iter: 2000
  Random Forest:
    n_estimators: 200
    min_samples_leaf: 3
  XGBoost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
  XGBoost + SMOTE:
    smote_ratio: 0.1   # minority/majority ratio after oversampling (train only)
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
