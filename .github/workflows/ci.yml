name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Lint
        run: ruff check src tests app.py
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Smoke training on synthetic data (every dataset)
        run: |
          for ds in creditcard sparkov; do
            python -m fraud.synthetic --dataset $ds --rows 5000 --out /tmp/$ds.csv
            python -m fraud.train --config configs/$ds.yaml --data /tmp/$ds.csv               --artifacts /tmp/artifacts/$ds --outputs /tmp/outputs/$ds
            test -f /tmp/artifacts/$ds/fraud_model.joblib
          done
