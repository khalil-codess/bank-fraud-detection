# Sparkov simulated card transactions. CLI flags of `python -m fraud.train` override these values.
# Download fraudTrain.csv + fraudTest.csv from https://www.kaggle.com/datasets/kartik2112/fraud-detection
# into data/raw/sparkov/.
dataset: sparkov
seed: 42

paths:
  data: data/raw/sparkov        # folder: every CSV inside is loaded, then re-split by time
  artifacts: artifacts/sparkov
  outputs: outputs/sparkov

split:            # chronological: train | validation | test
  val_frac: 0.15
  test_frac: 0.15

threshold:
  method: cost    # cost: maximise savings | fbeta: maximise F-beta
  beta: 1.0

costs:
  review_cost: 5.0  # cost of investigating one alert (USD). A missed fraud costs its full amount.

evaluation:
  cv_folds: 4
  cv_fold_frac: 0.1
  selection_metric: savings_rate
  alert_budgets_per_day: [10, 20, 50]   # ~10 frauds a day in this dataset

explain:
  shap: true
  sample_size: 500

models:
  Logistic Regression:
    max_iter: 2000
  Random Forest:              # lighter than for creditcard: 1.85M rows
    n_estimators: 100
    min_samples_leaf: 3
    max_samples: 0.3          # each tree sees a 30% bootstrap sample
  XGBoost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
  XGBoost + SMOTE:
    smote_ratio: 0.1
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
