[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud"
dynamic = ["version"]
description = "Bank fraud detection with chronological evaluation, SHAP explanations and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohamed Khalil Kouki" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
fraud-train = "fraud.train:main"

[tool.setuptools.dynamic]
version = { attr = "fraud.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["fraud"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
